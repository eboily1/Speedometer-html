<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord Fonctionnel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #030a16;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        /* Conteneur calé sur les proportions de l'image */
        .dashboard-container {
            position: relative;
            width: 960px;  
            height: 540px; 
            
            /* APPEL DE L'IMAGE LOCALE TRÈS LÉGER */
            background-image: url('dashboard.png'); 
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9);
        }

        /* Masque de couleur identique au fond pour masquer le "0" d'origine */
        .center-mask {
            position: absolute;
            top: 41%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 100px;
            background: #041126; 
            border-radius: 50%;
            z-index: 1;
        }

        /* --- Vitesse Actuelle (Centre) --- */
        .vitesse-actuelle {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6.5rem;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0, 153, 255, 0.6);
            z-index: 3;
        }

        /* --- Kilométrage TRIP --- */
        .trip-val {
            position: absolute;
            bottom: 21.5%;
            left: 50%;
            transform: translateX(-50%);
            background: #193663;
            border: 1px solid #0099ff;
            padding: 4px 20px;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 15px rgba(0,153,255,0.4);
            z-index: 3;
        }

        /* --- Vitesse Max (Gauche) --- */
        .vitesse-max-val {
            position: absolute;
            top: 45.5%;
            left: 14.8%;
            transform: translate(-50%, -50%);
            font-size: 4.5rem;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
            z-index: 3;
        }

        /* --- Horloge (Droite) --- */
        .horloge-val {
            position: absolute;
            top: 46%;
            right: 14.8%;
            transform: translate(50%, -50%);
            font-size: 4.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
            z-index: 3;
        }

        /* --- L'Aiguille Bleue Dynamique --- */
        .aiguille {
            position: absolute;
            top: 15%;
            left: 50%;
            width: 4px;
            height: 35%; 
            background: linear-gradient(to top, transparent 30%, #00a2ff 100%);
            transform-origin: bottom center;
            transform: rotate(-140deg); 
            transition: transform 0.08s linear;
            box-shadow: 0 0 15px #00a2ff;
            z-index: 2;
        }

        .needle-pivot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Cache le vieux texte fixe de l'image -->
        <div class="center-mask"></div>

        <!-- Textes et aiguille dynamiques -->
        <div class="vitesse-max-val" id="max-speed">129</div>
        
        <div class="aiguille" id="needle">
            <div class="needle-pivot"></div>
        </div>
        
        <div class="vitesse-actuelle" id="current-speed">0</div>
        <div class="trip-val" id="odometer">0.0 km</div>

        <div class="horloge-val" id="clock">12:40</div>
    </div>

    <script>
        // 1. Horloge système réelle
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Script d'animation du compteur
        const speedEl = document.getElementById('current-speed');
        const maxSpeedEl = document.getElementById('max-speed');
        const needle = document.getElementById('needle');
        const odometerEl = document.getElementById('odometer');
        
        let speed = 0;
        let maxSpeed = 129;
        let distance = 0.0;
        let accelerating = true;

        setInterval(() => {
            if (accelerating) {
                speed += Math.random() * 2.2;
                if (speed >= 105) accelerating = false; 
            } else {
                speed -= Math.random() * 2.8;
                if (speed <= 0) {
                    speed = 0;
                    accelerating = true;
                }
            }

            const currentActualSpeed = Math.floor(speed);
            speedEl.innerText = currentActualSpeed;

            if (currentActualSpeed > maxSpeed) {
                maxSpeed = currentActualSpeed;
                maxSpeedEl.innerText = maxSpeed;
            }

            // Gestion de l'angle de l'aiguille (-140deg à +140deg)
            const cappedSpeed = Math.min(Math.max(currentActualSpeed, 0), 100);
            const angle = -140 + (cappedSpeed * 2.8); 
            needle.style.transform = `rotate(${angle}deg)`;

            // Calcul de la distance parcourue
            distance += (speed / 3600) * 0.1;
            odometerEl.innerText = `${distance.toFixed(1)} km`;

        }, 100);
    </script>
</body>
</html>
