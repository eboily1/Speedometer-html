<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Speedometer Pro</title>
  <style>
    :root {
      --bg: #000000;
      --panel-bg: rgba(5, 17, 28, 0.85);
      --panel-border: rgba(35, 146, 255, 0.95);
      --panel-glow: rgba(32, 162, 255, 0.88);
      --dial-outer: #020b14;
      --dial-mid: rgba(12, 27, 38, 0.96);
      --dial-inner: #eef2f7;
      --dial-ink: rgba(8, 18, 26, 0.92);
      --dial-blue: rgba(32, 148, 255, 0.95);
      --dial-blue-soft: rgba(32, 148, 255, 0.42);
      --needle: #ff7b19;
      --needle-dark: #ff5b00;
      --digit: rgba(8, 16, 22, 0.84);
      --panel-text: rgba(233, 242, 255, 0.9);
      --muted: rgba(18, 34, 46, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, rgba(19, 125, 255, 0.15), rgba(0,0,0,0) 38%),
        #000;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(18, 120, 255, 0.14), rgba(0,0,0,0) 42%);
      pointer-events: none;
    }

    .panel {
      position: absolute;
      top: 50%;
      width: min(27vw, 330px);
      height: 195px;
      transform: translateY(-50%);
      background: linear-gradient(180deg, rgba(4, 17, 28, 0.92), rgba(6, 18, 29, 0.78));
      border: 2px solid var(--panel-border);
      border-radius: 18px;
      box-shadow:
        0 0 0 2px rgba(7, 18, 27, 0.9),
        inset 0 0 18px rgba(8, 26, 37, 0.78),
        0 0 22px rgba(20, 126, 255, 0.6),
        0 0 44px rgba(20, 126, 255, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 22px 24px 18px 28px;
      z-index: 2;
    }

    .panel.left { left: clamp(18px, 4vw, 56px); }
    .panel.right { right: clamp(18px, 4vw, 56px); }

    .panel-label {
      font-size: 14px;
      letter-spacing: 0.16em;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(232, 242, 255, 0.9);
      margin-bottom: 18px;
      padding-left: 4px;
    }

    .panel-value {
      display: flex;
      align-items: flex-end;
      line-height: 0.82;
      letter-spacing: -0.07em;
      color: rgba(240, 246, 255, 0.96);
      font-weight: 300;
    }

    .panel-value .big {
      font-size: clamp(52px, 4vw, 100px);
      font-weight: 300;
    }

    .panel-value .unit {
      margin-left: 10px;
      margin-bottom: 10px;
      font-size: 21px;
      letter-spacing: 0.06em;
      color: rgba(228, 240, 255, 0.72);
      text-transform: lowercase;
    }

    .panel.right .panel-value {
      width: 100%;
      justify-content: flex-start;
    }

    .dial-wrap {
      position: relative;
      width: min(78vw, 820px);
      height: min(78vw, 820px);
      max-width: 820px;
      max-height: 820px;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial-glow {
      position: absolute;
      inset: 7% 11% 4% 11%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34, 155, 255, 0.45), rgba(9, 90, 190, 0.22) 32%, rgba(0,0,0,0) 64%);
      filter: blur(26px);
      transform: scale(1.08);
      pointer-events: none;
    }

    .dial {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(180deg, #030b11 0%, #010d16 18%, #030d15 38%, #050d18 100%);
      box-shadow:
        0 0 0 18px rgba(5, 18, 26, 0.96),
        0 0 0 28px rgba(11, 21, 29, 0.92),
        0 0 30px rgba(23, 129, 255, 0.9),
        0 0 70px rgba(23, 129, 255, 0.8),
        0 0 120px rgba(23, 129, 255, 0.38),
        inset 0 0 32px rgba(0, 0, 0, 0.78);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px solid rgba(18, 42, 56, 0.56);
      box-shadow: inset 0 0 18px rgba(10, 17, 27, 0.7);
      pointer-events: none;
    }

    .dial-inner {
      position: absolute;
      inset: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, rgba(255,255,255,1), rgba(235,239,244,1) 58%, rgba(221,226,232,1) 100%);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.14);
      overflow: hidden;
    }

    .dial-inner::before {
      content: "";
      position: absolute;
      inset: 20px 20px 20px 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 33%, rgba(255,255,255,0.9), rgba(255,255,255,0) 58%);
      pointer-events: none;
    }

    #gauge {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 2;
    }

    .center-readout {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 54%;
      height: 54%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 4;
      text-align: center;
      pointer-events: none;
    }

    .speed-readout {
      font-size: clamp(92px, 8vw, 170px);
      line-height: 0.8;
      letter-spacing: -0.1em;
      font-weight: 300;
      color: rgba(10, 18, 28, 0.9);
    }

    .kmh {
      margin-top: 10px;
      font-size: 26px;
      letter-spacing: 0.04em;
      font-weight: 500;
      color: rgba(19, 24, 31, 0.68);
    }

    .trip-line {
      width: 128px;
      height: 4px;
      margin-top: 18px;
      border-radius: 4px;
      background: rgba(17, 31, 41, 0.74);
    }

    .trip-label {
      margin-top: 12px;
      font-size: 16px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(12, 20, 28, 0.8);
    }

    .trip-box {
      position: absolute;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      background: rgba(130, 168, 205, 0.18);
      border-radius: 12px;
      padding: 12px 20px 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: rgba(12, 25, 37, 0.84);
      box-shadow: inset 0 0 12px rgba(121, 149, 178, 0.18);
      z-index: 5;
      pointer-events: none;
    }

    .hidden-slider {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 1100px) {
      .panel {
        width: 260px;
        height: 170px;
      }
      .panel.left { left: 22px; }
      .panel.right { right: 22px; }
      .panel-label { font-size: 12px; }
      .panel-value .big { font-size: 52px; }
    }

    @media (max-width: 760px) {
      .panel {
        width: 180px;
        height: 120px;
        padding: 16px 14px;
      }
      .panel-label {
        font-size: 9px;
        letter-spacing: 0.12em;
        margin-bottom: 10px;
      }
      .panel-value .big { font-size: 40px; }
      .panel-value .unit { font-size: 12px; margin-left: 6px; margin-bottom: 5px; }
      .dial-wrap { width: 92vw; height: 92vw; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="panel left">
      <div class="panel-label">VITESSE MAX</div>
      <div class="panel-value">
        <span class="big">129</span>
        <span class="unit">km/h</span>
      </div>
    </div>

    <div class="dial-wrap">
      <div class="dial-glow"></div>
      <div class="dial">
        <div class="dial-inner"></div>
        <svg id="gauge" viewBox="0 0 600 600" aria-label="Speedometer gauge" role="img"></svg>
        <div class="center-readout">
          <div class="speed-readout">0</div>
          <div class="kmh">km/h</div>
          <div class="trip-line"></div>
          <div class="trip-label">TRIP</div>
        </div>
        <div class="trip-box">0.0 km</div>
      </div>
    </div>

    <div class="panel right">
      <div class="panel-label">HEURE</div>
      <div class="panel-value">
        <span class="big">12:40</span>
      </div>
    </div>

    <input id="speed-input" class="hidden-slider" type="range" min="0" max="100" value="0" />
  </div>

  <script>
    const svg = document.getElementById('gauge');
    const speedReadout = document.querySelector('.speed-readout');
    const speedInput = document.getElementById('speed-input');

    const cx = 300;
    const cy = 300;
    const outerRadius = 260;
    const startAngle = (210 * Math.PI) / 180;
    const endAngle = (330 * Math.PI) / 180;
    const totalTicks = 100;

    function valueToAngle(value) {
      return startAngle + (value / totalTicks) * (endAngle - startAngle);
    }

    function createSVG(tag, attrs = {}) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function drawGauge() {
      svg.innerHTML = '';

      const arc = createSVG('path', {
        d: `M ${cx + Math.cos(startAngle) * outerRadius} ${cy + Math.sin(startAngle) * outerRadius} A ${outerRadius} ${outerRadius} 0 0 1 ${cx + Math.cos(endAngle) * outerRadius} ${cy + Math.sin(endAngle) * outerRadius}`,
        fill: 'none',
        stroke: 'rgba(34, 155, 255, 0.82)',
        'stroke-width': '2.5',
        'stroke-linecap': 'round'
      });
      svg.appendChild(arc);

      for (let i = 0; i <= totalTicks; i += 10) {
        const angle = valueToAngle(i);
        const isMajor = i % 20 === 0;
        const tickLength = isMajor ? 20 : 11;
        const x1 = cx + Math.cos(angle) * outerRadius;
        const y1 = cy + Math.sin(angle) * outerRadius;
        const x2 = cx + Math.cos(angle) * (outerRadius - tickLength);
        const y2 = cy + Math.sin(angle) * (outerRadius - tickLength);

        const line = createSVG('line', {
          x1, y1, x2, y2,
          stroke: isMajor ? '#0b1d2b' : '#0d5ab5',
          'stroke-width': isMajor ? '2.5' : '1.4',
          'stroke-linecap': 'round'
        });
        svg.appendChild(line);

        if (isMajor) {
          const labelRadius = 160;
          const tx = cx + Math.cos(angle) * labelRadius;
          const ty = cy + Math.sin(angle) * labelRadius;
          const text = createSVG('text', {
            x: tx,
            y: ty,
            fill: '#0a2337',
            'font-size': 30,
            'font-weight': 700,
            'font-family': 'system-ui, sans-serif',
            'text-anchor': 'middle',
            'dominant-baseline': 'middle'
          });
          text.textContent = String(i);
          svg.appendChild(text);
        }
      }

      const needleAngle = valueToAngle(0);
      const needleLen = 150;
      const needleBase = 18;
      const needleLeft = cx + Math.cos(needleAngle - Math.PI / 2) * needleBase;
      const needleTop = cy + Math.sin(needleAngle - Math.PI / 2) * needleBase;
      const needleTip = cx + Math.cos(needleAngle) * needleLen;
      const needleTipY = cy + Math.sin(needleAngle) * needleLen;
      const needleRight = cx + Math.cos(needleAngle + Math.PI / 2) * needleBase;
      const needleBottom = cy + Math.sin(needleAngle + Math.PI / 2) * needleBase;

      const needle = createSVG('path', {
        d: `M ${needleLeft} ${needleTop} L ${needleTip} ${needleTipY} L ${needleRight} ${needleBottom} Z`,
        fill: '#ff7b15',
        opacity: '0.96'
      });
      svg.appendChild(needle);

      const cap = createSVG('circle', {
        cx,
        cy,
        r: 12,
        fill: '#111111',
        stroke: '#2a2a2a',
        'stroke-width': '1.5'
      });
      svg.appendChild(cap);
    }

    let currentSpeed = 0;
    let targetSpeed = 0;

    function updateGauge() {
      currentSpeed += (targetSpeed - currentSpeed) * 0.12;
      if (Math.abs(targetSpeed - currentSpeed) < 0.05) currentSpeed = targetSpeed;
      speedReadout.textContent = Math.round(currentSpeed);
      drawGauge();
      requestAnimationFrame(updateGauge);
    }

    speedInput.addEventListener('input', (event) => {
      targetSpeed = Number(event.target.value);
    });

    drawGauge();
    updateGauge();
  </script>
</body>
</html>
