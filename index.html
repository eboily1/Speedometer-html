<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Speedometer Pro</title>
  <style>
    :root {
      --bg: #000000;
      --deep-blue: #040b13;
      --blue-1: #071a2f;
      --blue-2: #0e5bd4;
      --blue-3: #34b6ff;
      --blue-4: rgba(13, 125, 255, 0.9);
      --panel: rgba(4, 15, 24, 0.8);
      --panel-border: rgba(26, 143, 255, 0.9);
      --panel-glow: rgba(15, 146, 255, 0.8);
      --dial-border: rgba(17, 26, 38, 0.96);
      --dial-ring: rgba(11, 31, 44, 0.95);
      --needle: #ff7e1a;
      --needle-dark: #ff6800;
      --face: #f1f3f5;
      --face-shadow: rgba(0,0,0,0.18);
      --digit: rgba(7, 13, 20, 0.86);
      --white: #eef6ff;
      --muted: rgba(16, 24, 32, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(9, 113, 255, 0.12), rgba(0,0,0,0) 45%);
      pointer-events: none;
    }

    .panel {
      position: absolute;
      top: 50%;
      width: 300px;
      height: 185px;
      transform: translateY(-50%);
      background: linear-gradient(180deg, rgba(4, 15, 26, 0.9), rgba(7, 18, 30, 0.75));
      border: 2px solid var(--panel-border);
      border-radius: 18px;
      box-shadow:
        0 0 0 2px rgba(7, 18, 27, 0.9),
        inset 0 0 18px rgba(9, 29, 38, 0.7),
        0 0 24px rgba(13, 120, 255, 0.65);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 24px 18px 26px;
      z-index: 2;
    }

    .panel.left {
      left: 60px;
    }

    .panel.right {
      right: 60px;
      align-items: flex-start;
    }

    .panel-label {
      font-size: 12px;
      letter-spacing: 0.18em;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(228, 240, 255, 0.82);
      margin-bottom: 18px;
      padding-left: 2px;
    }

    .panel-value {
      font-weight: 300;
      color: rgba(245, 249, 255, 0.95);
      display: flex;
      align-items: flex-end;
      line-height: 0.9;
      letter-spacing: -0.08em;
      text-transform: none;
    }

    .panel-value .big {
      font-size: clamp(52px, 4vw, 86px);
    }

    .panel-value .unit {
      font-size: 22px;
      letter-spacing: 0.06em;
      color: rgba(228, 240, 255, 0.7);
      margin-left: 10px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .panel.right .panel-value .big {
      font-size: clamp(46px, 3.6vw, 78px);
      letter-spacing: -0.05em;
    }

    .dial-wrap {
      position: relative;
      width: min(74vw, 760px);
      height: min(74vw, 760px);
      max-width: 760px;
      max-height: 760px;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial-glow {
      position: absolute;
      inset: 4% 7% 1% 7%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(29, 153, 255, 0.35), rgba(8, 75, 167, 0.2) 32%, rgba(0,0,0,0) 60%);
      filter: blur(24px);
      transform: scale(1.12);
      pointer-events: none;
    }

    .dial {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(180deg, #02070c 0%, #020c14 15%, #030d12 40%, #040d16 100%);
      box-shadow:
        0 0 0 14px rgba(10, 18, 26, 0.9),
        0 0 26px rgba(17, 125, 255, 0.9),
        0 0 60px rgba(20, 130, 255, 0.65),
        0 0 120px rgba(20, 130, 255, 0.35),
        inset 0 0 34px rgba(3, 16, 24, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial-inner {
      position: absolute;
      inset: 42px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,1), rgba(223,228,234,1) 100%);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.18);
      overflow: hidden;
    }

    .dial-inner::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 38%, rgba(255,255,255,0.95), rgba(255,255,255,0) 54%);
      pointer-events: none;
    }

    #gauge {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 1;
    }

    .center-readout {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 54%;
      height: 54%;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(9, 16, 22, 0.9);
      z-index: 3;
      text-align: center;
      pointer-events: none;
    }

    .speed-readout {
      font-size: clamp(84px, 7vw, 140px);
      line-height: 0.8;
      letter-spacing: -0.09em;
      font-weight: 300;
      color: rgba(7, 18, 28, 0.88);
    }

    .kmh {
      font-size: 26px;
      letter-spacing: 0.04em;
      font-weight: 500;
      margin-top: 10px;
      color: rgba(12, 22, 32, 0.7);
      text-transform: none;
    }

    .trip-line {
      width: 120px;
      height: 4px;
      margin-top: 18px;
      border-radius: 4px;
      background: rgba(18, 31, 42, 0.72);
    }

    .trip-label {
      margin-top: 12px;
      font-size: 16px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(9, 17, 22, 0.8);
    }

    .trip-box {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      background: rgba(138, 177, 208, 0.18);
      border-radius: 12px;
      padding: 8px 20px 10px;
      font-size: 18px;
      color: rgba(12, 25, 37, 0.84);
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: inset 0 0 12px rgba(123, 150, 180, 0.18);
      z-index: 4;
      pointer-events: none;
    }

    .hidden-slider {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 1100px) {
      .panel {
        width: 240px;
        height: 160px;
      }

      .panel.left {
        left: 24px;
      }

      .panel.right {
        right: 24px;
      }
    }

    @media (max-width: 760px) {
      .scene {
        padding: 0 8px;
      }

      .panel {
        width: 170px;
        height: 120px;
        padding: 16px 14px;
      }

      .panel-label {
        font-size: 9px;
        letter-spacing: 0.12em;
        margin-bottom: 10px;
      }

      .panel-value .big {
        font-size: 32px;
      }

      .panel-value .unit {
        font-size: 12px;
        margin-left: 6px;
        margin-bottom: 4px;
      }

      .dial-wrap {
        width: 92vw;
        height: 92vw;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="panel left">
      <div class="panel-label">VITESSE MAX</div>
      <div class="panel-value">
        <span class="big">129</span>
        <span class="unit">km/h</span>
      </div>
    </div>

    <div class="dial-wrap">
      <div class="dial-glow"></div>
      <div class="dial">
        <div class="dial-inner"></div>
        <svg id="gauge" viewBox="0 0 600 600" aria-label="Speedometer gauge" role="img"></svg>
        <div class="center-readout">
          <div class="speed-readout">0</div>
          <div class="kmh">km/h</div>
          <div class="trip-line"></div>
          <div class="trip-label">TRIP</div>
        </div>
        <div class="trip-box">0.0 km</div>
      </div>
    </div>

    <div class="panel right">
      <div class="panel-label">HEURE</div>
      <div class="panel-value">
        <span class="big">12:40</span>
      </div>
    </div>

    <input id="speed-input" class="hidden-slider" type="range" min="0" max="100" value="0" />
  </div>

  <script>
    const svg = document.getElementById('gauge');
    const speedReadout = document.querySelector('.speed-readout');
    const speedInput = document.getElementById('speed-input');

    const cx = 300;
    const cy = 300;
    const outerRadius = 260;
    const innerRadius = 220;
    const startAngle = (210 * Math.PI) / 180;
    const endAngle = (330 * Math.PI) / 180;
    const totalTicks = 100;

    function valueToAngle(value) {
      return startAngle + (value / totalTicks) * (endAngle - startAngle);
    }

    function createSVG(tag, attrs = {}) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function drawGauge() {
      svg.innerHTML = '';

      const outerArc = createSVG('path', {
        d: `M ${cx + Math.cos(startAngle) * outerRadius} ${cy + Math.sin(startAngle) * outerRadius} A ${outerRadius} ${outerRadius} 0 0 1 ${cx + Math.cos(endAngle) * outerRadius} ${cy + Math.sin(endAngle) * outerRadius}`,
        fill: 'none',
        stroke: 'rgba(37, 174, 255, 0.82)',
        'stroke-width': '2.2',
        'stroke-linecap': 'round'
      });
      svg.appendChild(outerArc);

      for (let i = 0; i <= totalTicks; i += 10) {
        const angle = valueToAngle(i);
        const isMajor = i % 20 === 0;
        const tickLength = isMajor ? 18 : 10;
        const x1 = cx + Math.cos(angle) * outerRadius;
        const y1 = cy + Math.sin(angle) * outerRadius;
        const x2 = cx + Math.cos(angle) * (outerRadius - tickLength);
        const y2 = cy + Math.sin(angle) * (outerRadius - tickLength);

        const line = createSVG('line', {
          x1, y1, x2, y2,
          stroke: isMajor ? '#0a2336' : '#0f5eb7',
          'stroke-width': isMajor ? '2.2' : '1.5',
          'stroke-linecap': 'round'
        });
        svg.appendChild(line);

        if (isMajor) {
          const labelRadius = 148;
          const tx = cx + Math.cos(angle) * labelRadius;
          const ty = cy + Math.sin(angle) * labelRadius;
          const text = createSVG('text', {
            x: tx,
            y: ty,
            fill: '#0b2337',
            'font-size': 28,
            'font-weight': 700,
            'font-family': 'system-ui, sans-serif',
            'text-anchor': 'middle',
            'dominant-baseline': 'middle'
          });
          text.textContent = String(i);
          svg.appendChild(text);
        }
      }

      const needleAngle = valueToAngle(0);
      const needleLeft = cx + Math.cos(needleAngle - Math.PI / 2) * 18;
      const needleTop = cy + Math.sin(needleAngle - Math.PI / 2) * 18;
      const needleTip = cx + Math.cos(needleAngle) * 150;
      const needleTipY = cy + Math.sin(needleAngle) * 150;
      const needleRight = cx + Math.cos(needleAngle + Math.PI / 2) * 18;
      const needleBottom = cy + Math.sin(needleAngle + Math.PI / 2) * 18;

      const needle = createSVG('path', {
        d: `M ${needleLeft} ${needleTop} L ${needleTip} ${needleTipY} L ${needleRight} ${needleBottom} Z`,
        fill: '#ff7b15',
        opacity: '0.96'
      });
      svg.appendChild(needle);

      const cap = createSVG('circle', {
        cx,
        cy,
        r: 12,
        fill: '#111111',
        stroke: '#2c2c2c',
        'stroke-width': '1.5'
      });
      svg.appendChild(cap);
    }

    let currentSpeed = 0;
    let targetSpeed = 0;

    function updateGauge() {
      currentSpeed += (targetSpeed - currentSpeed) * 0.12;
      if (Math.abs(targetSpeed - currentSpeed) < 0.05) currentSpeed = targetSpeed;
      speedReadout.textContent = Math.round(currentSpeed);
      drawGauge();
      requestAnimationFrame(updateGauge);
    }

    speedInput.addEventListener('input', (event) => {
      targetSpeed = Number(event.target.value);
    });

    drawGauge();
    updateGauge();
  </script>
</body>
</html>
