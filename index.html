<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- BALISES MAGIQUES POUR SUPPRIMER LA BARRE DE NAVIGATION SUR IPHONE -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dashboard GPS">

    <title>Tableau de Bord GPS iPhone 7</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #030a16;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            color: #fff;
            overflow: hidden;
        }

        .dashboard-container {
            position: relative;
            width: 100vw;  
            height: 100vh; 
            height: -webkit-fill-available;
            background-image: url('./dashboard.png'); 
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .vitesse-max-val {
            position: absolute;
            top: 45.5%;
            left: 14.0%; 
            transform: translate(-50%, -50%);
            font-size: 7.5vh;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
            text-align: center;
            width: 18vw;
        }

        .horloge-val {
            position: absolute;
            top: 47%;
            right: 14.0%; 
            transform: translate(50%, -50%);
            font-size: 7vh;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
            text-align: center;
            width: 22vw;
        }

        .vitesse-actuelle {
            position: absolute;
            top: 41%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11vh;
            font-weight: 700;
            text-shadow: 0 0 25px rgba(0, 153, 255, 0.6);
            z-index: 5;
        }

        .trip-val {
            position: absolute;
            bottom: 20.0%; 
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2vh;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 153, 255, 0.8);
            z-index: 5;
            letter-spacing: 1px;
        }

        .aiguille-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 66vh;
            height: 66vh;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none;
        }

        .aiguille {
            position: absolute;
            top: 0;
            left: calc(50% - 2px);
            width: 4px;
            height: 100%; 
            transform-origin: center center;
            transform: rotate(-140deg); 
            transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            
            -webkit-mask-image: radial-gradient(circle, transparent 76%, black 77%);
            mask-image: radial-gradient(circle, transparent 76%, black 77%);
        }

        .aiguille::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 24%; 
            background: linear-gradient(to top, #0066ff 0%, #00d9ff 100%);
            box-shadow: 0 0 15px #00a2ff, 0 0 5px #fff;
            border-radius: 4px;
        }

        .gps-status {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5vh;
            letter-spacing: 1px;
            color: #ff3333;
            text-transform: uppercase;
            font-weight: bold;
            z-index: 10;
        }
        .gps-status.active {
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
        }

        .orientation-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #040d21;
            z-index: 9999;
            color: white;
            text-align: center;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 1.2rem;
            padding: 20px;
        }

        @media (orientation: portrait) {
            .orientation-warning {
                display: flex;
            }
            .dashboard-container {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="orientation-warning">
        <p style="font-size: 2rem; margin-bottom: 10px;">🔄</p>
        <p>Veuillez tourner votre iPhone en <b>mode paysage</b>.</p>
    </div>

    <div class="dashboard-container">
        <div class="gps-status" id="gps-status">GPS Déconnecté</div>
        <div class="vitesse-max-val" id="max-speed">0</div>

        <div class="aiguille-wrapper">
            <div class="aiguille" id="needle"></div>
        </div>
        <div class="vitesse-actuelle" id="current-speed">0</div>
        <div class="trip-val" id="odometer">0.0 km</div>

        <div class="horloge-val" id="clock">00:00</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = 
                `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const speedEl = document.getElementById('current-speed');
        const maxSpeedEl = document.getElementById('max-speed');
        const needle = document.getElementById('needle');
        const odometerEl = document.getElementById('odometer');
        const gpsStatusEl = document.getElementById('gps-status');
        
        let maxSpeed = 0;
        let totalDistance = 0.0;
        let lastPosition = null;

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(updateGPSData, handleGPSError, {
                enableHighAccuracy: true, 
                maximumAge: 0,            
                timeout: 5000             
            });
        }

        function updateGPSData(position) {
            gpsStatusEl.innerText = "GPS Actif";
            gpsStatusEl.classList.add('active');

            let speedMS = position.coords.speed;
            let currentSpeed = 0;

            if (speedMS !== null && speedMS > 0) {
                currentSpeed = Math.floor(speedMS * 3.6);
            }

            speedEl.innerText = currentSpeed;

            if (currentSpeed > maxSpeed) {
                maxSpeed = currentSpeed;
                maxSpeedEl.innerText = maxSpeed;
            }

            const cappedSpeed = Math.min(Math.max(currentSpeed, 0), 100);
            const angle = -140 + (cappedSpeed * 2.8); 
            needle.style.transform = `rotate(${angle}deg)`;

            if (lastPosition) {
                totalDistance += calculateDistance(
                    lastPosition.coords.latitude, lastPosition.coords.longitude,
                    position.coords.latitude, position.coords.longitude
                );
                odometerEl.innerText = `${totalDistance.toFixed(1)} km`;
            }
            lastPosition = position;
        }

        function handleGPSError(error) {
            gpsStatusEl.classList.remove('active');
            gpsStatusEl.innerText = "Signal GPS faible...";
        }

        // Haversine formula
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }
    </script>
</body>
</html>
