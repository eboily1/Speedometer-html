<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Speedometer Pro</title>
  <style>
    :root {
      --bg: #000000;
      --blue-strong: #0d7dff;
      --blue-bright: #2db9ff;
      --blue-glow: rgba(29, 157, 255, 0.9);
      --panel-bg: rgba(6, 18, 31, 0.82);
      --panel-border: rgba(38, 146, 255, 0.9);
      --dial-outer: #050d17;
      --dial-inner: #eef3f7;
      --dial-shadow: rgba(15, 120, 255, 0.75);
      --dark-text: rgba(8, 16, 22, 0.9);
      --light-text: rgba(228, 240, 255, 0.9);
      --muted: rgba(16, 24, 32, 0.7);
      --needle: #ff7a1a;
      --needle-dark: #f15c00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 50%, rgba(19, 118, 255, 0.14), rgba(0,0,0,0) 36%),
        #000;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(26, 138, 255, 0.18), rgba(0,0,0,0) 42%);
      pointer-events: none;
    }

    .panel {
      position: absolute;
      top: 50%;
      width: 330px;
      height: 195px;
      transform: translateY(-50%);
      background: linear-gradient(180deg, rgba(3, 17, 28, 0.9), rgba(5, 17, 30, 0.8));
      border: 2px solid var(--panel-border);
      border-radius: 18px;
      box-shadow:
        0 0 0 2px rgba(7, 18, 27, 0.9),
        inset 0 0 18px rgba(7, 24, 34, 0.75),
        0 0 22px rgba(21, 128, 255, 0.6),
        0 0 50px rgba(21, 128, 255, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 26px 24px 18px 28px;
      z-index: 2;
    }

    .panel.left {
      left: clamp(18px, 4vw, 64px);
    }

    .panel.right {
      right: clamp(18px, 4vw, 64px);
    }

    .panel-label {
      font-size: 14px;
      letter-spacing: 0.18em;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(228, 240, 255, 0.9);
      margin-bottom: 16px;
      padding-left: 4px;
    }

    .panel-value {
      font-weight: 300;
      color: rgba(245, 249, 255, 0.95);
      display: flex;
      align-items: flex-end;
      line-height: 0.9;
      letter-spacing: -0.08em;
      text-transform: none;
    }

    .panel-value .big {
      font-size: clamp(58px, 4vw, 104px);
      font-weight: 300;
      line-height: 0.8;
    }

    .panel-value .unit {
      font-size: 24px;
      letter-spacing: 0.06em;
      color: rgba(228, 240, 255, 0.7);
      margin-left: 10px;
      margin-bottom: 12px;
      text-transform: lowercase;
    }

    .panel.right .panel-value {
      width: 100%;
      justify-content: flex-start;
    }

    .panel.right .panel-value .big {
      font-size: clamp(52px, 4vw, 96px);
      letter-spacing: -0.06em;
    }

    .dial-wrap {
      position: relative;
      width: min(74vw, 760px);
      height: min(74vw, 760px);
      max-width: 760px;
      max-height: 760px;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial-glow {
      position: absolute;
      inset: 4% 7% 1% 7%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(29, 153, 255, 0.42), rgba(8, 75, 167, 0.24) 32%, rgba(0,0,0,0) 64%);
      filter: blur(24px);
      transform: scale(1.12);
      pointer-events: none;
    }

    .dial {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(180deg, #02070c 0%, #020d17 18%, #030d14 40%, #040d18 100%);
      box-shadow:
        0 0 0 18px rgba(3, 11, 18, 0.96),
        0 0 0 22px rgba(13, 22, 31, 0.9),
        0 0 30px rgba(17, 125, 255, 0.8),
        0 0 72px rgba(20, 130, 255, 0.64),
        0 0 120px rgba(20, 130, 255, 0.24),
        inset 0 0 30px rgba(6, 22, 34, 0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .dial::before {
      content: "";
      position: absolute;
      inset: 30px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px rgba(15, 30, 42, 0.3);
      pointer-events: none;
    }

    .dial-inner {
      position: absolute;
      inset: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 34%, rgba(255,255,255,1), rgba(231,236,241,1) 64%, rgba(214,220,228,1) 100%);
      box-shadow:
        inset 0 0 20px rgba(0,0,0,0.12),
        inset 0 0 0 2px rgba(0, 0, 0, 0.02);
      overflow: hidden;
    }

    .dial-inner::before {
      content: "";
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 34%, rgba(255,255,255,0.9), rgba(255,255,255,0) 58%);
      pointer-events: none;
    }

    #gauge {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 1;
    }

    .center-readout {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 55%;
      height: 55%;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(9, 16, 22, 0.9);
      z-index: 3;
      text-align: center;
      pointer-events: none;
    }

    .speed-readout {
      font-size: clamp(86px, 7vw, 150px);
      line-height: 0.8;
      letter-spacing: -0.09em;
      font-weight: 300;
      color: rgba(7, 18, 28, 0.9);
    }

    .kmh {
      font-size: 24px;
      letter-spacing: 0.04em;
      font-weight: 500;
      margin-top: 10px;
      color: rgba(12, 22, 32, 0.7);
      text-transform: none;
    }

    .trip-line {
      width: 118px;
      height: 4px;
      margin-top: 18px;
      border-radius: 4px;
      background: rgba(18, 31, 42, 0.72);
    }

    .trip-label {
      margin-top: 12px;
      font-size: 15px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(9, 17, 22, 0.8);
    }

    .trip-box {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      background: rgba(138, 177, 208, 0.18);
      border-radius: 12px;
      padding: 9px 20px 10px;
      font-size: 18px;
      color: rgba(12, 25, 37, 0.84);
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: inset 0 0 12px rgba(123, 150, 180, 0.18);
      z-index: 4;
      pointer-events: none;
    }

    .hidden-slider {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 1100px) {
      .panel {
        width: 260px;
        height: 170px;
        padding: 20px 20px 16px 22px;
      }

      .panel.left {
        left: 22px;
      }

      .panel.right {
        right: 22px;
      }

      .panel-label {
        font-size: 12px;
      }
    }

    @media (max-width: 760px) {
      .scene {
        padding: 0 8px;
      }

      .panel {
        width: 180px;
        height: 120px;
        padding: 16px 14px;
      }

      .panel-label {
        font-size: 9px;
        letter-spacing: 0.12em;
        margin-bottom: 10px;
      }

      .panel-value .big {
        font-size: 42px;
      }

      .panel-value .unit {
        font-size: 12px;
        margin-left: 6px;
        margin-bottom: 5px;
      }

      .dial-wrap {
        width: 92vw;
        height: 92vw;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="panel left">
      <div class="panel-label">VITESSE MAX</div>
      <div class="panel-value">
        <span class="big">129</span>
        <span class="unit">km/h</span>
      </div>
    </div>

    <div class="dial-wrap">
      <div class="dial-glow"></div>
      <div class="dial">
        <div class="dial-inner"></div>
        <svg id="gauge" viewBox="0 0 600 600" aria-label="Speedometer gauge" role="img"></svg>
        <div class="center-readout">
          <div class="speed-readout">0</div>
          <div class="kmh">km/h</div>
          <div class="trip-line"></div>
          <div class="trip-label">TRIP</div>
        </div>
        <div class="trip-box">0.0 km</div>
      </div>
    </div>

    <div class="panel right">
      <div class="panel-label">HEURE</div>
      <div class="panel-value">
        <span class="big">12:40</span>
      </div>
    </div>

    <input id="speed-input" class="hidden-slider" type="range" min="0" max="100" value="0" />
  </div>

  <script>
    const svg = document.getElementById('gauge');
    const speedReadout = document.querySelector('.speed-readout');
    const speedInput = document.getElementById('speed-input');

    const cx = 300;
    const cy = 300;
    const outerRadius = 260;
    const tickRadius = 220;
    const labelRadius = 156;
    const startAngle = (210 * Math.PI) / 180;
    const endAngle = (330 * Math.PI) / 180;
    const totalTicks = 100;

    function valueToAngle(value) {
      return startAngle + (value / totalTicks) * (endAngle - startAngle);
    }

    function createSVG(tag, attrs = {}) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function drawGauge() {
      svg.innerHTML = '';

      const outerArc = createSVG('path', {
        d: `M ${cx + Math.cos(startAngle) * outerRadius} ${cy + Math.sin(startAngle) * outerRadius} A ${outerRadius} ${outerRadius} 0 0 1 ${cx + Math.cos(endAngle) * outerRadius} ${cy + Math.sin(endAngle) * outerRadius}`,
        fill: 'none',
        stroke: 'rgba(20, 136, 255, 0.8)',
        'stroke-width': '2.5',
        'stroke-linecap': 'round'
      });
      svg.appendChild(outerArc);

      const glowArc = createSVG('path', {
        d: `M ${cx + Math.cos(startAngle) * (outerRadius - 8)} ${cy + Math.sin(startAngle) * (outerRadius - 8)} A ${outerRadius - 8} ${outerRadius - 8} 0 0 1 ${cx + Math.cos(endAngle) * (outerRadius - 8)} ${cy + Math.sin(endAngle) * (outerRadius - 8)}`,
        fill: 'none',
        stroke: 'rgba(34, 172, 255, 0.55)',
        'stroke-width': '1.5',
        'stroke-linecap': 'round'
      });
      svg.appendChild(glowArc);

      for (let i = 0; i <= totalTicks; i += 10) {
        const angle = valueToAngle(i);
        const isMajor = i % 20 === 0;
        const tickLength = isMajor ? 20 : 11;

        const x1 = cx + Math.cos(angle) * outerRadius;
        const y1 = cy + Math.sin(angle) * outerRadius;
        const x2 = cx + Math.cos(angle) * (outerRadius - tickLength);
        const y2 = cy + Math.sin(angle) * (outerRadius - tickLength);

        const line = createSVG('line', {
          x1, y1, x2, y2,
          stroke: isMajor ? '#0a2336' : '#114f95',
          'stroke-width': isMajor ? '2.2' : '1.3',
          'stroke-linecap': 'round'
        });
        svg.appendChild(line);

        if (isMajor) {
          const tx = cx + Math.cos(angle) * labelRadius;
          const ty = cy + Math.sin(angle) * labelRadius;
          const text = createSVG('text', {
            x: tx,
            y: ty,
            fill: '#0b2337',
            'font-size': 30,
            'font-weight': 700,
            'font-family': 'system-ui, sans-serif',
            'text-anchor': 'middle',
            'dominant-baseline': 'middle'
          });
          text.textContent = String(i);
          svg.appendChild(text);
        }
      }

      const needleAngle = valueToAngle(0);
      const needleLen = 140;
      const needleBase = 18;
      const needleLeft = cx + Math.cos(needleAngle - Math.PI / 2) * needleBase;
      const needleTop = cy + Math.sin(needleAngle - Math.PI / 2) * needleBase;
      const needleTip = cx + Math.cos(needleAngle) * needleLen;
      const needleTipY = cy + Math.sin(needleAngle) * needleLen;
      const needleRight = cx + Math.cos(needleAngle + Math.PI / 2) * needleBase;
      const needleBottom = cy + Math.sin(needleAngle + Math.PI / 2) * needleBase;

      const needle = createSVG('path', {
        d: `M ${needleLeft} ${needleTop} L ${needleTip} ${needleTipY} L ${needleRight} ${needleBottom} Z`,
        fill: '#ff7b15',
        opacity: '0.96'
      });
      svg.appendChild(needle);

      const cap = createSVG('circle', {
        cx,
        cy,
        r: 12,
        fill: '#111111',
        stroke: '#2c2c2c',
        'stroke-width': '1.5'
      });
      svg.appendChild(cap);
    }

    let currentSpeed = 0;
    let targetSpeed = 0;

    function updateGauge() {
      currentSpeed += (targetSpeed - currentSpeed) * 0.12;
      if (Math.abs(targetSpeed - currentSpeed) < 0.05) currentSpeed = targetSpeed;
      speedReadout.textContent = Math.round(currentSpeed);
      drawGauge();
      requestAnimationFrame(updateGauge);
    }

    speedInput.addEventListener('input', (event) => {
      targetSpeed = Number(event.target.value);
    });

    drawGauge();
    updateGauge();
  </script>
</body>
</html>
