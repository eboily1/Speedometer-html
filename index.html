<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Speedometer Pro</title>
  <style>
    :root {
      --bg: #000000;
      --panel-bg: rgba(5, 18, 30, 0.9);
      --panel-border: rgba(32, 145, 255, 0.95);
      --panel-glow: rgba(30, 146, 255, 0.7);
      --dial-outer: #020a12;
      --dial-dark: rgba(5, 15, 23, 0.96);
      --dial-face: #edf2f7;
      --label-dark: rgba(8, 18, 27, 0.9);
      --muted-dark: rgba(13, 26, 36, 0.72);
      --blue-glow: rgba(16, 136, 255, 0.55);
      --blue-primary: #1e95ff;
      --blue-bright: #56c4ff;
      --needle: #2ca0ff;
      --needle-deep: #0b7adf;
      --text-light: rgba(230, 240, 255, 0.92);
      --trip-bg: rgba(120, 168, 207, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(17, 115, 255, 0.14), rgba(0,0,0,0) 42%);
      pointer-events: none;
    }

    .panel {
      position: absolute;
      top: 50%;
      width: 330px;
      height: 190px;
      transform: translateY(-50%);
      background: linear-gradient(180deg, rgba(5, 17, 28, 0.9), rgba(5, 16, 28, 0.8));
      border: 2px solid var(--panel-border);
      border-radius: 18px;
      box-shadow:
        0 0 0 2px rgba(7, 18, 27, 0.9),
        inset 0 0 18px rgba(8, 23, 35, 0.78),
        0 0 22px rgba(20, 126, 255, 0.6),
        0 0 50px rgba(20, 126, 255, 0.12);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 22px 24px 18px 28px;
      z-index: 2;
    }

    .panel.left {
      left: 52px;
    }

    .panel.right {
      right: 52px;
    }

    .panel-label {
      font-size: 15px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(231, 242, 255, 0.9);
      margin-bottom: 18px;
      padding-left: 4px;
    }

    .panel-value {
      display: flex;
      align-items: flex-end;
      line-height: 0.82;
      letter-spacing: -0.08em;
      color: rgba(245, 249, 255, 0.96);
      font-weight: 300;
    }

    .panel-value .big {
      font-size: clamp(58px, 3.9vw, 100px);
      font-weight: 300;
    }

    .panel-value .unit {
      font-size: 22px;
      letter-spacing: 0.06em;
      color: rgba(228, 240, 255, 0.72);
      margin-left: 10px;
      margin-bottom: 10px;
      text-transform: lowercase;
    }

    .right-value {
      width: 100%;
      justify-content: flex-start;
    }

    .dial-wrap {
      position: relative;
      width: min(76vw, 820px);
      height: min(76vw, 820px);
      max-width: 820px;
      max-height: 820px;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial-glow {
      position: absolute;
      inset: 6% 8% 2% 8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(36, 155, 255, 0.42), rgba(11, 83, 176, 0.22) 32%, rgba(0,0,0,0) 66%);
      filter: blur(22px);
      transform: scale(1.08);
      pointer-events: none;
    }

    .dial {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(180deg, #02070c 0%, #020c14 16%, #030d15 40%, #050d19 100%);
      box-shadow:
        0 0 0 18px rgba(8, 17, 24, 0.96),
        0 0 0 22px rgba(11, 20, 28, 0.94),
        0 0 26px rgba(17, 125, 255, 0.8),
        0 0 72px rgba(20, 130, 255, 0.6),
        0 0 120px rgba(20, 130, 255, 0.32),
        inset 0 0 28px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px solid rgba(18, 36, 47, 0.6);
      pointer-events: none;
    }

    .dial-inner {
      position: absolute;
      inset: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 32%, rgba(255,255,255,1), rgba(234,238,243,1) 58%, rgba(219,226,233,1) 100%);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .dial-inner::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 34%, rgba(255,255,255,0.9), rgba(255,255,255,0) 56%);
      pointer-events: none;
    }

    #gauge {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 2;
    }

    .center-readout {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 56%;
      height: 56%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 4;
      pointer-events: none;
    }

    .speed-readout {
      font-size: clamp(88px, 7.2vw, 154px);
      line-height: 0.8;
      letter-spacing: -0.1em;
      font-weight: 300;
      color: rgba(10, 18, 28, 0.9);
    }

    .kmh {
      margin-top: 10px;
      font-size: 26px;
      letter-spacing: 0.04em;
      font-weight: 500;
      color: rgba(17, 25, 33, 0.7);
    }

    .trip-line {
      width: 122px;
      height: 4px;
      margin-top: 18px;
      border-radius: 4px;
      background: rgba(18, 32, 41, 0.76);
    }

    .trip-label {
      margin-top: 12px;
      font-size: 16px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(12, 20, 29, 0.82);
    }

    .trip-box {
      position: absolute;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      background: rgba(130, 170, 209, 0.18);
      border-radius: 12px;
      padding: 9px 20px 11px;
      font-size: 18px;
      color: rgba(12, 25, 37, 0.84);
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: inset 0 0 12px rgba(120, 150, 180, 0.18);
      z-index: 5;
      pointer-events: none;
    }

    .hidden-slider {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 1100px) {
      .panel {
        width: 260px;
        height: 170px;
      }
      .panel.left { left: 28px; }
      .panel.right { right: 28px; }
      .panel-label { font-size: 12px; }
      .panel-value .big { font-size: 54px; }
    }

    @media (max-width: 760px) {
      .panel {
        width: 180px;
        height: 120px;
        padding: 16px 14px;
      }
      .panel-label {
        font-size: 9px;
        letter-spacing: 0.12em;
        margin-bottom: 8px;
      }
      .panel-value .big { font-size: 42px; }
      .panel-value .unit { font-size: 11px; margin-left: 6px; margin-bottom: 4px; }
      .dial-wrap {
        width: 92vw;
        height: 92vw;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="panel left">
      <div class="panel-label">VITESSE MAX</div>
      <div class="panel-value">
        <span class="big">129</span>
        <span class="unit">km/h</span>
      </div>
    </div>

    <div class="dial-wrap">
      <div class="dial-glow"></div>
      <div class="dial">
        <div class="dial-inner"></div>
        <svg id="gauge" viewBox="0 0 600 600" aria-label="Speedometer gauge" role="img"></svg>
        <div class="center-readout">
          <div class="speed-readout">0</div>
          <div class="kmh">km/h</div>
          <div class="trip-line"></div>
          <div class="trip-label">TRIP</div>
        </div>
        <div class="trip-box">0.0 km</div>
      </div>
    </div>

    <div class="panel right">
      <div class="panel-label">HEURE</div>
      <div class="panel-value right-value">
        <span class="big">12:40</span>
      </div>
    </div>

    <input id="speed-input" class="hidden-slider" type="range" min="0" max="100" value="0" />
  </div>

  <script>
    const svg = document.getElementById('gauge');
    const speedReadout = document.querySelector('.speed-readout');
    const speedInput = document.getElementById('speed-input');

    const cx = 300;
    const cy = 300;
    const outerRadius = 260;
    const startAngle = (210 * Math.PI) / 180;
    const endAngle = (330 * Math.PI) / 180;
    const totalTicks = 100;

    function valueToAngle(value) {
      return startAngle + (value / totalTicks) * (endAngle - startAngle);
    }

    function createSVG(tag, attrs = {}) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function drawGauge() {
      svg.innerHTML = '';

      const outerArc = createSVG('path', {
        d: `M ${cx + Math.cos(startAngle) * outerRadius} ${cy + Math.sin(startAngle) * outerRadius} A ${outerRadius} ${outerRadius} 0 0 1 ${cx + Math.cos(endAngle) * outerRadius} ${cy + Math.sin(endAngle) * outerRadius}`,
        fill: 'none',
        stroke: 'rgba(34, 154, 255, 0.85)',
        'stroke-width': '2.4',
        'stroke-linecap': 'round'
      });
      svg.appendChild(outerArc);

      for (let i = 0; i <= totalTicks; i += 10) {
        const angle = valueToAngle(i);
        const isMajor = i % 20 === 0;
        const tickLength = isMajor ? 18 : 10;

        const x1 = cx + Math.cos(angle) * outerRadius;
        const y1 = cy + Math.sin(angle) * outerRadius;
        const x2 = cx + Math.cos(angle) * (outerRadius - tickLength);
        const y2 = cy + Math.sin(angle) * (outerRadius - tickLength);

        const line = createSVG('line', {
          x1, y1, x2, y2,
          stroke: isMajor ? '#0a2336' : '#0f58bc',
          'stroke-width': isMajor ? '2.2' : '1.4',
          'stroke-linecap': 'round'
        });
        svg.appendChild(line);

        if (isMajor) {
          const radius = 152;
          const tx = cx + Math.cos(angle) * radius;
          const ty = cy + Math.sin(angle) * radius;
          const text = createSVG('text', {
            x: tx,
            y: ty,
            fill: '#0b2337',
            'font-size': 28,
            'font-weight': 700,
            'font-family': 'system-ui, sans-serif',
            'text-anchor': 'middle',
            'dominant-baseline': 'middle'
          });
          text.textContent = String(i);
          svg.appendChild(text);
        }
      }

      const needleAngle = valueToAngle(0);
      const needleLength = 148;
      const needleHalf = 18;
      const left = cx + Math.cos(needleAngle - Math.PI / 2) * needleHalf;
      const top = cy + Math.sin(needleAngle - Math.PI / 2) * needleHalf;
      const tipX = cx + Math.cos(needleAngle) * needleLength;
      const tipY = cy + Math.sin(needleAngle) * needleLength;
      const right = cx + Math.cos(needleAngle + Math.PI / 2) * needleHalf;
      const bottom = cy + Math.sin(needleAngle + Math.PI / 2) * needleHalf;

      const needle = createSVG('path', {
        d: `M ${left} ${top} L ${tipX} ${tipY} L ${right} ${bottom} Z`,
        fill: '#2ea8ff',
        opacity: '1'
      });
      svg.appendChild(needle);

      const cap = createSVG('circle', {
        cx,
        cy,
        r: 12,
        fill: '#111111',
        stroke: '#2a2a2a',
        'stroke-width': '1.5'
      });
      svg.appendChild(cap);
    }

    let currentSpeed = 0;
    let targetSpeed = 0;

    function updateGauge() {
      currentSpeed += (targetSpeed - currentSpeed) * 0.12;
      if (Math.abs(targetSpeed - currentSpeed) < 0.05) currentSpeed = targetSpeed;
      speedReadout.textContent = Math.round(currentSpeed);
      drawGauge();
      requestAnimationFrame(updateGauge);
    }

    speedInput.addEventListener('input', (event) => {
      targetSpeed = Number(event.target.value);
    });

    drawGauge();
    updateGauge();
  </script>
</body>
</html>
